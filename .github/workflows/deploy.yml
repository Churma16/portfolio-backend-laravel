name: Deploy Backend Laravel

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build Image and Deploy Laravel Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/churma16/portfolio-backend-laravel:${{ github.ref_name }}
            ghcr.io/churma16/portfolio-backend-laravel:latest

      - name: Activate Service and Verify on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -d /root/churma-codes/scripts ]; then
              cd /root/churma-codes
              ./scripts/deploy.sh laravel "ghcr.io/churma16/portfolio-backend-laravel:${{ github.ref_name }}"
              ./scripts/smoke-test.sh laravel
            else
              echo "[info] /root/churma-codes not yet found on VPS. Skipping container activation until infra is deployed."
            fi

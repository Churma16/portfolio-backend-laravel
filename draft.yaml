models:
  Profile:
    name: string:200
    headline: string:255 nullable
    bio: text nullable
    avatar: string:500 nullable
    cv_files: string:500 nullable
    socials: json nullable

  Category:
    name: string:100
    slug: string:100 unique
    relationships:
      hasMany: TechStack, Tag

  TechStack:
    name: string:100,
    slug: string:100 unique
    icon: string:255 nullable
    category_id: unsignedBigInteger nullable
    relationships:
      belongsTo: Category
      belongsToMany: Project

  Tag:
    name: string:100
    slug: string:100 unique
    color: string:10 nullable default: #c1c1c1
    category_id: unsignedBigInteger nullable
    relationships:
      belongsTo: Category
      belongsToMany: Project, WorkExperience

  Project:
    title: string:200
    slug: string:200 unique
    thumbnail: string:500 nullable
    content: text nullable
    demo_url: string:500 nullable
    repo_url: string:500 nullable
    is_featured: boolean default:false
    published_at: timestamp nullable
    relationships:
      belongsToMany: TechStack, Tag

  WorkExperience:
    company: string:200
    position: string:200
    location: string:200 nullable
    start_date: date
    end_date: date nullable
    is_current: boolean default:false
    description: text nullable
    relationships:
      belongsToMany: TechStack, Tag

resources:
  Profile: all
  Project: all
  TechStack: all
  Tag: all
  Category: all
  WorkExperience: all

seeders: Profile, Category, TechStack, Project, Tag, WorkExperience

controllers:
  Api/V1/Profile:
    resource: api
  Api/V1/Project:
    resource: api
  Api/V1/TechStack:
    resource: api
  Api/V1/Tag:
    resource: api
  Api/V1/WorkExperience:
    resource: api
  Api/V1/Category:
    resource: api

